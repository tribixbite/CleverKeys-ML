<!-- Add this to the HEAD section of swipe-onnx.html -->
<script src="performance-enhancements.js"></script>

<!-- Add this to the body where you want the metrics display -->
<div id="metrics" class="fixed bottom-4 right-4 p-3 bg-black/80 backdrop-blur rounded-lg border border-neon-blue/30 text-sm font-mono text-gray-400 hidden">
    <div class="grid grid-cols-3 gap-4">
        <div class="text-center">
            <div class="text-xs text-gray-500">Inference</div>
            <div><span id="inferenceTime" class="text-neon-green font-bold">--</span>ms</div>
        </div>
        <div class="text-center">
            <div class="text-xs text-gray-500">WPM</div>
            <div class="text-neon-cyan font-bold" id="wordsPerMinute">--</div>
        </div>
        <div class="text-center">
            <div class="text-xs text-gray-500">Gestures</div>
            <div class="text-neon-purple font-bold" id="gestureCount">0</div>
        </div>
    </div>
</div>

<!-- Add recording controls to the header -->
<div class="flex gap-2">
    <button onclick="toggleRecording()"
            id="recordBtn"
            class="px-3 py-1.5 rounded-lg bg-red-500/20 hover:bg-red-500/30 border border-red-500/50 text-red-400 text-sm transition-all">
        <span id="recordIcon">🔴</span> Record
    </button>
    <button onclick="window.gestureRecorder.exportRecordings()"
            class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-gray-400 text-sm transition-all">
        💾 Export
    </button>
</div>

<script>
// Integration code - add to existing JavaScript

// Initialize performance tracking
const perfMetrics = window.perfMetrics || new PerformanceMetrics();
const modelPreloader = window.modelPreloader || new ModelPreloader();
const gestureRecorder = window.gestureRecorder || new GestureRecorder();

// Modify the existing runInference function to track metrics
async function runInferenceWithMetrics(features) {
    const startTime = performance.now();

    try {
        // Call original runInference
        const result = await runInference(features);

        const latency = performance.now() - startTime;

        // Track metrics
        perfMetrics.recordInference(latency);
        perfMetrics.recordGesture();

        // Record gesture if enabled
        if (gestureRecorder.isRecording) {
            gestureRecorder.finishRecording(
                features,
                currentModelPath,
                latency
            );
        }

        return result;
    } catch (error) {
        console.error('Inference error:', error);
        throw error;
    }
}

// Modify switchModel to use cached models
async function switchModelWithCache(modelPath) {
    try {
        updateLoadingStatus(`Loading ${modelPath}...`);
        document.getElementById('loadingOverlay').classList.remove('hidden');

        if (encoderSession) {
            encoderSession = null;
        }

        const sessionOptions = {
            executionProviders: ['wasm'],
            graphOptimizationLevel: 'all',
            enableCpuMemArena: false,
            enableMemPattern: false,
            executionMode: 'sequential'
        };

        // Use cached model if available
        encoderSession = await modelPreloader.loadModelFromCache(modelPath, sessionOptions);

        currentModelPath = modelPath;
        window.isModelReady = true;

        updateLoadingStatus('');
        document.getElementById('loadingOverlay').classList.add('hidden');

        // Update UI
        updateStatusIndicator('ready', `Model: ${modelPath.replace('.onnx', '')}`);

    } catch (error) {
        console.error('Failed to switch model:', error);
        updateStatusIndicator('error', 'Model loading failed');
    }
}

// Recording toggle
let isRecordingMode = false;

function toggleRecording() {
    isRecordingMode = !isRecordingMode;
    const btn = document.getElementById('recordBtn');

    if (isRecordingMode) {
        btn.classList.add('bg-red-500/50', 'animate-pulse');
        btn.innerHTML = '<span id="recordIcon">⏹</span> Stop';
        console.log('🔴 Recording mode ENABLED - gestures will be saved');
    } else {
        btn.classList.remove('bg-red-500/50', 'animate-pulse');
        btn.innerHTML = '<span id="recordIcon">🔴</span> Record';
        console.log('⏹ Recording mode DISABLED');
    }
}

// Enhanced swipe trail with performance tracking
function drawEnhancedSwipeTrail(points, keyData) {
    if (points.length < 2) return;

    // Track gesture for recording
    if (isRecordingMode && !gestureRecorder.isRecording) {
        // Start recording when gesture begins
        const lastWord = inputText.split(' ').pop() || 'unknown';
        gestureRecorder.startRecording(lastWord);
    }

    // Add points to recording
    if (gestureRecorder.isRecording) {
        points.forEach(p => gestureRecorder.addPoint(p));
    }

    // Original trail drawing code...
    ctx.save();

    // Multiple passes for glow effect
    for (let pass = 0; pass < 3; pass++) {
        ctx.lineWidth = (8 - pass * 2);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        points.forEach((point, i) => {
            const progress = i / (points.length - 1);

            // Color interpolation from cyan to purple
            const r = Math.round(0 + progress * 179);
            const g = Math.round(212 - progress * 212);
            const b = 255;

            // Fading effect for older parts
            const alpha = 0.3 + (progress * 0.7) * (0.8 - pass * 0.2);

            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;

            if (i === 0) {
                ctx.moveTo(point.x, point.y);
            } else {
                const prevPoint = points[i - 1];
                const cpx = (prevPoint.x + point.x) / 2;
                const cpy = (prevPoint.y + point.y) / 2;
                ctx.quadraticCurveTo(prevPoint.x, prevPoint.y, cpx, cpy);
            }
        });

        ctx.stroke();
    }

    // Draw key position indicators
    if (keyData && keyData.length > 0) {
        keyData.forEach((key, index) => {
            const alpha = 0.6 + (index / keyData.length) * 0.4;

            // Circle for key position
            ctx.fillStyle = `rgba(179, 0, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(key.x, key.y, 8, 0, Math.PI * 2);
            ctx.fill();

            // Key label
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(key.char, key.x, key.y);
        });
    }

    ctx.restore();
}

// Show statistics
function showRecordingStats() {
    const stats = gestureRecorder.getStatistics();
    console.log('📊 Recording Statistics:', stats);

    const statsHtml = `
        <div class="fixed top-20 right-4 p-4 bg-black/90 rounded-lg border border-neon-blue/50">
            <h3 class="text-neon-cyan font-bold mb-2">Recording Stats</h3>
            <div class="text-sm text-gray-300">
                <div>Total: ${stats.totalRecordings} recordings</div>
                <div>Words: ${stats.uniqueWords} unique</div>
                <div>Avg Points: ${stats.averagePoints}</div>
                <div>Avg Duration: ${stats.averageDuration}ms</div>
                <div>Avg Inference: ${stats.averageInference}ms</div>
            </div>
            <button onclick="this.parentElement.remove()"
                    class="mt-2 px-2 py-1 bg-red-500/20 rounded text-xs text-red-400">
                Close
            </button>
        </div>
    `;

    document.body.insertAdjacentHTML('beforeend', statsHtml);
}

// Add keyboard shortcut for stats
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && e.key === 'S') {
        showRecordingStats();
    }
});

console.log('✨ Performance enhancements loaded:');
console.log('  - Real-time metrics tracking');
console.log('  - Model preloading with IndexedDB cache');
console.log('  - Gesture recording for dataset collection');
console.log('  - Press Ctrl+Shift+S to show recording stats');
</script>
