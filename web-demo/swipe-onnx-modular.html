<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Swipe Typing - Modular ONNX Demo</title>

    <!-- External Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/swipe-demo.css">

    <!-- JavaScript Modules -->
    <script src="js/feature-extractor-corrected.js"></script>
    <script src="js/onnx-rnnt-decoder-fixed.js"></script>
    <script src="js/ctc-decoder.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header-container">
            <div style="padding: 16px; text-align: center;">
                <h1 class="neon-text" style="font-size: 28px; font-weight: bold; margin-bottom: 4px;">
                    Neural Swipe Typing - ONNX
                </h1>
                <p id="status" style="color: #9ca3af; font-size: 14px; margin-top: 4px;">Loading models...</p>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar" style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div id="statusIndicator" class="status-indicator"></div>
                    <span id="statusText" style="color: #d1d5db; font-size: 14px;">Initializing...</span>
                </div>
            </div>
            <div style="display: flex; gap: 8px;">
                <button id="clearBtn" class="control-btn">Clear</button>
                <select id="modelType" class="model-select">
                    <option value="rnnt">RNN-T Model (Advanced)</option>
                    <option value="ctc">CTC Model (Character-based)</option>
                </select>
                <button id="debugBtn" class="control-btn">Debug: OFF</button>
                <button id="testBtn" class="control-btn">Test "hello"</button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div style="flex: 1; display: flex; flex-direction: column; min-height: 0; padding-bottom: 280px;">
            <!-- Input Display -->
            <div class="input-display">
                <div style="color: #9ca3af; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;">
                    Input Text
                </div>
                <div id="inputText" style="color: white; font-size: 18px; min-height: 25px; word-break: break-word;"></div>
            </div>

            <!-- Suggestions -->
            <div id="suggestions" class="suggestions-container">
                <div style="color: #6b7280; font-size: 14px;">Tap or swipe on the keyboard to begin</div>
            </div>

            <!-- Debug Output -->
            <div id="debugOutput" class="debug-output" style="display: none;">
                <pre id="debugText"></pre>
            </div>
        </div>

        <!-- Keyboard Container -->
        <div class="keyboard-container">
            <div class="keyboard-wrapper">
                <div class="keyboard-surface keyboard-area">
                    <!-- Canvas for swipe trail -->
                    <canvas id="swipeCanvas"></canvas>

                    <!-- Keyboard Layout -->
                    <div class="keyboard-rows">
                        <!-- First Row: Q-P -->
                        <div class="keyboard-row">
                            <button class="key" data-key="q">Q</button>
                            <button class="key" data-key="w">W</button>
                            <button class="key" data-key="e">E</button>
                            <button class="key" data-key="r">R</button>
                            <button class="key" data-key="t">T</button>
                            <button class="key" data-key="y">Y</button>
                            <button class="key" data-key="u">U</button>
                            <button class="key" data-key="i">I</button>
                            <button class="key" data-key="o">O</button>
                            <button class="key" data-key="p">P</button>
                        </div>

                        <!-- Second Row: A-L -->
                        <div class="keyboard-row" style="padding: 0 20px;">
                            <button class="key" data-key="a">A</button>
                            <button class="key" data-key="s">S</button>
                            <button class="key" data-key="d">D</button>
                            <button class="key" data-key="f">F</button>
                            <button class="key" data-key="g">G</button>
                            <button class="key" data-key="h">H</button>
                            <button class="key" data-key="j">J</button>
                            <button class="key" data-key="k">K</button>
                            <button class="key" data-key="l">L</button>
                        </div>

                        <!-- Third Row: Shift, Z-M, Backspace -->
                        <div class="keyboard-row">
                            <button class="key key-special key-shift" data-key="shift">⇧</button>
                            <button class="key" data-key="z">Z</button>
                            <button class="key" data-key="x">X</button>
                            <button class="key" data-key="c">C</button>
                            <button class="key" data-key="v">V</button>
                            <button class="key" data-key="b">B</button>
                            <button class="key" data-key="n">N</button>
                            <button class="key" data-key="m">M</button>
                            <button class="key key-special key-backspace" data-key="backspace">⌫</button>
                        </div>

                        <!-- Fourth Row: Special Keys -->
                        <div class="keyboard-row">
                            <button class="key key-special" data-key="123" style="min-width: 60px;">123</button>
                            <button class="key key-special" data-key="emoji" style="min-width: 60px;">😊</button>
                            <button class="key key-space" data-key=" ">space</button>
                            <button class="key key-special key-return" data-key="return">return</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let featureExtractor;
        let rnntDecoder;
        let ctcDecoder;
        let currentModelType = 'rnnt';
        let debugMode = false;
        let isDrawing = false;
        let swipePath = [];
        let canvas, ctx;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            console.log('🚀 Initializing Modular ONNX Demo...');

            // Setup canvas
            setupCanvas();

            // Initialize components
            featureExtractor = new SwipeFeatureExtractorCorrected();

            // Load models
            try {
                updateStatus('Loading models...');

                // Initialize RNN-T decoder
                rnntDecoder = new RNNTDecoder();
                await rnntDecoder.initialize(
                    'models/rnnt_new/encoder.onnx',
                    'models/rnnt_new/decoder_joint.onnx',
                    'models/rnnt_new/runtime_meta.json'
                );
                // Feature extractor is used directly, not passed to decoder

                // Initialize CTC decoder (commented out - model not available)
                // ctcDecoder = new CTCDecoder();
                // await ctcDecoder.initialize(
                //     'models/ctc/ctc_model.onnx',
                //     'models/ctc/tokenizer.json'
                // );

                console.log('✅ RNN-T model loaded successfully');
                updateStatus('Ready - RNN-T model loaded', 'ready');

                // Setup event handlers
                setupEventHandlers();

            } catch (error) {
                console.error('Failed to load models:', error);
                updateStatus(`Failed to load models: ${error.message}`, 'error');
            }
        }

        function setupCanvas() {
            canvas = document.getElementById('swipeCanvas');
            ctx = canvas.getContext('2d');

            // Make canvas fill the keyboard area
            const keyboard = document.querySelector('.keyboard-surface');
            const resizeCanvas = () => {
                const rect = keyboard.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            };

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        // Enhanced neon trail drawing
        function drawNeonTrail() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (swipePath.length < 2) return;

            const totalPoints = swipePath.length;
            const rect = document.querySelector('.keyboard-surface').getBoundingClientRect();

            // Draw shadow/glow layer first
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(179, 0, 255, 0.6)';

            // Draw multiple passes for enhanced glow
            for (let pass = 0; pass < 2; pass++) {
                ctx.beginPath();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                for (let i = 0; i < totalPoints - 1; i++) {
                    const progress = i / totalPoints;

                    // Convert normalized coordinates to canvas coordinates
                    const x1 = (swipePath[i].x + 1) * rect.width / 2;
                    const y1 = (swipePath[i].y + 1) * rect.height / 2;
                    const x2 = (swipePath[i + 1].x + 1) * rect.width / 2;
                    const y2 = (swipePath[i + 1].y + 1) * rect.height / 2;

                    // Create gradient that transitions from cyan to purple
                    const gradient = ctx.createLinearGradient(x1, y1, x2, y2);

                    // Fade out older parts of the trail
                    const opacity = 0.3 + (progress * 0.7);

                    gradient.addColorStop(0, `rgba(0, 212, 255, ${opacity})`);
                    gradient.addColorStop(1, `rgba(179, 0, 255, ${opacity})`);

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = pass === 0 ? 8 : 4; // Thicker for glow, thinner for core

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            }

            // Reset shadow for next draw
            ctx.shadowBlur = 0;
        }

        function setupEventHandlers() {
            // Clear button
            document.getElementById('clearBtn').addEventListener('click', () => {
                document.getElementById('inputText').textContent = '';
                clearSuggestions();
                updateStatus('Ready', 'ready');
            });

            // Debug button
            document.getElementById('debugBtn').addEventListener('click', () => {
                debugMode = !debugMode;
                document.getElementById('debugBtn').textContent = `Debug: ${debugMode ? 'ON' : 'OFF'}`;
                document.getElementById('debugOutput').style.display = debugMode ? 'block' : 'none';
            });

            // Test button
            document.getElementById('testBtn').addEventListener('click', () => {
                testSwipe();
            });

            // Model selector
            document.getElementById('modelType').addEventListener('change', (e) => {
                currentModelType = e.target.value;
                updateStatus(`Switched to ${currentModelType.toUpperCase()} model`, 'ready');
            });

            // Suggestion clicks
            document.getElementById('suggestions').addEventListener('click', e => {
                if (e.target.tagName === 'BUTTON') {
                    const text = e.target.textContent;
                    document.getElementById('inputText').textContent += text + ' ';
                    clearSuggestions();
                }
            });

            // Keyboard key clicks (single letter typing)
            document.querySelectorAll('.key').forEach(key => {
                key.addEventListener('click', (e) => {
                    const keyValue = e.target.getAttribute('data-key');
                    if (!keyValue) return;

                    // Handle special keys
                    if (keyValue === 'shift') {
                        // Toggle shift state (not implemented)
                        return;
                    } else if (keyValue === 'backspace') {
                        const input = document.getElementById('inputText');
                        input.textContent = input.textContent.slice(0, -1);
                    } else if (keyValue === 'return') {
                        document.getElementById('inputText').textContent += '\n';
                    } else if (keyValue === '123' || keyValue === 'emoji') {
                        // Not implemented
                        return;
                    } else {
                        // Regular key or space
                        document.getElementById('inputText').textContent += keyValue;
                    }

                    // Visual feedback
                    e.target.classList.add('key-active');
                    setTimeout(() => e.target.classList.remove('key-active'), 100);
                });
            });

            // Setup swipe gesture handling
            setupSwipeGestures();
        }

        function setupSwipeGestures() {
            const keyboard = document.querySelector('.keyboard-surface');

            // Convert touch/mouse position to keyboard coordinates
            const getCoordinates = (e) => {
                const rect = keyboard.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                // Keep coordinates in [0, 1] to match training
                const x = (clientX - rect.left) / rect.width;
                const y = (clientY - rect.top) / rect.height;

                return { x, y, t: Date.now() };
            };

            // Start swipe
            const startSwipe = (e) => {
                isDrawing = true;
                swipePath = [];
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const point = getCoordinates(e);
                swipePath.push(point);

                e.preventDefault();
            };

            // Continue swipe
            const continueSwipe = (e) => {
                if (!isDrawing) return;

                const point = getCoordinates(e);
                swipePath.push(point);

                // Draw enhanced neon trail
                drawNeonTrail();

                e.preventDefault();
            };

            // End swipe
            const endSwipe = async (e) => {
                if (!isDrawing || swipePath.length < 3) {
                    isDrawing = false;
                    return;
                }

                isDrawing = false;

                // Process the swipe
                await processSwipe(swipePath);

                // Clear canvas after a delay
                setTimeout(() => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }, 1000);

                e.preventDefault();
            };

            // Mouse events
            keyboard.addEventListener('mousedown', startSwipe);
            keyboard.addEventListener('mousemove', continueSwipe);
            keyboard.addEventListener('mouseup', endSwipe);
            keyboard.addEventListener('mouseleave', endSwipe);

            // Touch events
            keyboard.addEventListener('touchstart', startSwipe, { passive: false });
            keyboard.addEventListener('touchmove', continueSwipe, { passive: false });
            keyboard.addEventListener('touchend', endSwipe, { passive: false });
        }

        async function processSwipe(swipePath) {
            updateStatus('Processing...', 'loading');

            try {
                let result;
                const startTime = performance.now();

                if (currentModelType === 'rnnt') {
                    // Process with RNN-T model - extract features and decode
                    const featureData = featureExtractor.process(swipePath);
                    result = await rnntDecoder.greedyDecode(featureData);
                    console.log('RNN-T result:', result);
                } else {
                    // Process with CTC model (not available)
                    console.warn('CTC model not available');
                    result = [{ text: 'CTC not available' }];
                }

                const processingTime = performance.now() - startTime;
                console.log(`✅ Inference complete in ${processingTime.toFixed(1)}ms`);

                // Display results
                displaySuggestions(result);
                updateStatus(`Ready (${currentModelType.toUpperCase()})`, 'ready');

                // Debug output
                if (debugMode) {
                    const debugInfo = {
                        model: currentModelType,
                        pathLength: swipePath.length,
                        processingTime: `${processingTime.toFixed(1)}ms`,
                        results: result
                    };
                    document.getElementById('debugText').textContent = JSON.stringify(debugInfo, null, 2);
                }

            } catch (error) {
                console.error('Processing error:', error);
                updateStatus(`Processing failed: ${error.message}`, 'error');
            }
        }

        function displaySuggestions(results) {
            const container = document.getElementById('suggestions');
            container.innerHTML = '';

            // Handle different result formats
            let suggestions = [];
            if (Array.isArray(results)) {
                suggestions = results.slice(0, 5);
            } else if (results && results.predictions) {
                suggestions = results.predictions.slice(0, 5);
            } else if (results && results.text) {
                suggestions = [results.text];
            }

            if (suggestions.length === 0) {
                container.innerHTML = '<div style="color: #6b7280; font-size: 14px;">No suggestions</div>';
                return;
            }

            suggestions.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-btn';
                btn.textContent = typeof item === 'object' ? (item.text || item.token || '?') : item;
                container.appendChild(btn);
            });
        }

        function clearSuggestions() {
            const container = document.getElementById('suggestions');
            container.innerHTML = '<div style="color: #6b7280; font-size: 14px;">Tap or swipe on the keyboard to begin</div>';
        }

        function updateStatus(message, type = 'loading') {
            document.getElementById('status').textContent = message;
            document.getElementById('statusText').textContent = message;

            const indicator = document.getElementById('statusIndicator');
            indicator.className = 'status-indicator';

            if (type === 'ready') {
                indicator.classList.add('status-ready');
            } else if (type === 'loading') {
                indicator.classList.add('status-loading');
            } else if (type === 'error') {
                indicator.classList.add('status-error');
            }
        }

        async function testSwipe() {
            // Simulate a swipe for "hello"
            const testPath = [
                {x: -0.784, y: 0.214, t: 0},    // h
                {x: -0.522, y: -0.193, t: 37},   // e
                {x: 0.307, y: 0.193, t: 74},     // l
                {x: 0.307, y: 0.193, t: 111},    // l
                {x: 0.522, y: -0.193, t: 148}    // o
            ];

            await processSwipe(testPath);
        }
    </script>
</body>
</html>
