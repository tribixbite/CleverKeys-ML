<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swipe Typing with RNN-T Decoder</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="rnnt-decoder.js"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        .prediction-word {
            display: inline-block;
            padding: 0.5rem 1rem;
            margin: 0.25rem;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 0.5rem;
            transition: all 0.3s;
        }

        .prediction-word:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.8);
            transform: scale(1.05);
        }

        .prediction-word.selected {
            background: rgba(0, 212, 255, 0.3);
            border-color: #00d4ff;
        }

        .loading-spinner {
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <!-- Header -->
    <div class="w-full max-w-4xl mb-6">
        <h1 class="text-4xl font-bold text-center mb-2 bg-gradient-to-r from-cyan-400 to-purple-600 text-transparent bg-clip-text">
            Swipe Typing with RNN-T Decoder
        </h1>
        <p class="text-center text-gray-400">Full encoder + decoder pipeline with beam search</p>
    </div>

    <!-- Status Bar -->
    <div class="w-full max-w-4xl mb-4 p-3 bg-gray-800 rounded-lg">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div id="statusIndicator" class="w-2 h-2 bg-gray-500 rounded-full"></div>
                <span id="statusText" class="text-sm text-gray-400">Initializing...</span>
            </div>
            <div class="flex items-center gap-4">
                <select id="modelSelector" class="px-3 py-1 bg-gray-700 rounded text-sm">
                    <option value="encoder_web_ultra.onnx">Web Ultra (25MB)</option>
                    <option value="encoder_fp32.onnx">FP32 Full (62MB)</option>
                </select>
                <button onclick="toggleDebug()" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm">
                    Debug: <span id="debugStatus">OFF</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Input Display -->
    <div class="w-full max-w-4xl mb-4 p-4 bg-gray-800 rounded-lg">
        <div id="inputDisplay" class="text-2xl font-mono min-h-[3rem]">
            <span class="text-gray-500">Start swiping to type...</span>
        </div>
    </div>

    <!-- Predictions Display -->
    <div class="w-full max-w-4xl mb-6">
        <div id="predictionsContainer" class="min-h-[4rem] p-4 bg-gray-800/50 rounded-lg">
            <div id="predictions" class="flex flex-wrap justify-center">
                <!-- Predictions will appear here -->
            </div>
        </div>
    </div>

    <!-- Canvas Container -->
    <div class="relative">
        <canvas id="swipeCanvas" width="800" height="300"
                class="border-2 border-gray-700 rounded-lg bg-gray-800 touch-none"></canvas>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="absolute inset-0 bg-gray-900/90 flex items-center justify-center rounded-lg">
            <div class="text-center">
                <div class="loading-spinner mx-auto mb-4"></div>
                <p class="text-cyan-400">Loading models...</p>
                <p id="loadingStatus" class="text-sm text-gray-500 mt-2"></p>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="w-full max-w-4xl mt-6 flex justify-center gap-4">
        <button onclick="clearCanvas()"
                class="px-6 py-2 bg-red-500/20 hover:bg-red-500/30 border border-red-500/50 rounded-lg text-red-400 transition-all">
            Clear
        </button>
        <button onclick="testWord('hello')"
                class="px-6 py-2 bg-green-500/20 hover:bg-green-500/30 border border-green-500/50 rounded-lg text-green-400 transition-all">
            Test "hello"
        </button>
        <button onclick="testWord('world')"
                class="px-6 py-2 bg-green-500/20 hover:bg-green-500/30 border border-green-500/50 rounded-lg text-green-400 transition-all">
            Test "world"
        </button>
    </div>

    <!-- Debug Info -->
    <div id="debugInfo" class="w-full max-w-4xl mt-6 p-4 bg-gray-800 rounded-lg text-xs font-mono text-gray-400 hidden">
        <div id="debugContent">Debug info will appear here...</div>
    </div>

    <script>
        // Global variables
        let decoder = null;
        let canvas = null;
        let ctx = null;
        let isDrawing = false;
        let swipePath = [];
        let inputText = '';
        let debugMode = false;

        // Keyboard layout
        const keyLayout = {
            'q': {x: 0.05, y: 0.25}, 'w': {x: 0.15, y: 0.25}, 'e': {x: 0.25, y: 0.25},
            'r': {x: 0.35, y: 0.25}, 't': {x: 0.45, y: 0.25}, 'y': {x: 0.55, y: 0.25},
            'u': {x: 0.65, y: 0.25}, 'i': {x: 0.75, y: 0.25}, 'o': {x: 0.85, y: 0.25},
            'p': {x: 0.95, y: 0.25},
            'a': {x: 0.10, y: 0.50}, 's': {x: 0.20, y: 0.50}, 'd': {x: 0.30, y: 0.50},
            'f': {x: 0.40, y: 0.50}, 'g': {x: 0.50, y: 0.50}, 'h': {x: 0.60, y: 0.50},
            'j': {x: 0.70, y: 0.50}, 'k': {x: 0.80, y: 0.50}, 'l': {x: 0.90, y: 0.50},
            'z': {x: 0.20, y: 0.75}, 'x': {x: 0.30, y: 0.75}, 'c': {x: 0.40, y: 0.75},
            'v': {x: 0.50, y: 0.75}, 'b': {x: 0.60, y: 0.75}, 'n': {x: 0.70, y: 0.75},
            'm': {x: 0.80, y: 0.75}
        };

        // Initialize on load
        window.addEventListener('DOMContentLoaded', async () => {
            canvas = document.getElementById('swipeCanvas');
            ctx = canvas.getContext('2d');

            // Setup canvas events
            setupCanvasEvents();

            // Draw keyboard
            drawKeyboard();

            // Initialize decoder
            await initializeDecoder();
        });

        async function initializeDecoder() {
            updateStatus('Initializing decoder...', 'loading');

            decoder = new RNNTDecoder();

            try {
                await decoder.initialize(
                    'encoder_web_ultra.onnx',
                    'rnnt_step_fp32.onnx',
                    '../trained_models/nema1/words.txt',
                    '../trained_models/nema1/runtime_meta.json'
                );

                updateStatus('Decoder ready', 'ready');
                document.getElementById('loadingOverlay').classList.add('hidden');

            } catch (error) {
                console.error('Failed to initialize decoder:', error);
                updateStatus('Initialization failed: ' + error.message, 'error');
            }
        }

        function setupCanvasEvents() {
            // Mouse events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            // Touch events
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                startDrawing({
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    target: e.target
                });
            });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                draw({
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    target: e.target
                });
            });

            canvas.addEventListener('touchend', stopDrawing);
        }

        function startDrawing(e) {
            isDrawing = true;
            swipePath = [];
            const point = getPoint(e);
            swipePath.push(point);
        }

        function draw(e) {
            if (!isDrawing) return;
            const point = getPoint(e);
            swipePath.push(point);
            drawSwipeTrail();
        }

        async function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;

            if (swipePath.length < 5) {
                clearCanvas();
                return;
            }

            // Process the swipe
            await processSwipe();
        }

        function getPoint(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) / canvas.width,
                y: (e.clientY - rect.top) / canvas.height,
                t: Date.now() - (swipePath[0]?.t || Date.now())
            };
        }

        async function processSwipe() {
            if (!decoder || !decoder.isReady) {
                updateStatus('Decoder not ready', 'error');
                return;
            }

            updateStatus('Processing gesture...', 'loading');
            showPredictions([{ word: 'Processing...', score: 0 }]);

            try {
                const predictions = await decoder.decodeFromGesture(swipePath);

                if (predictions.length > 0) {
                    showPredictions(predictions);
                    updateStatus(`Found ${predictions.length} predictions`, 'ready');

                    if (debugMode) {
                        showDebugInfo(predictions);
                    }
                } else {
                    showPredictions([{ word: 'No predictions', score: 0 }]);
                    updateStatus('No predictions found', 'warning');
                }

            } catch (error) {
                console.error('Decoding error:', error);
                updateStatus('Decoding failed: ' + error.message, 'error');
            }

            // Clear after delay
            setTimeout(clearCanvas, 2000);
        }

        function showPredictions(predictions) {
            const container = document.getElementById('predictions');
            container.innerHTML = '';

            predictions.slice(0, 5).forEach((pred, i) => {
                const div = document.createElement('div');
                div.className = 'prediction-word';
                if (i === 0) div.classList.add('selected');

                div.innerHTML = `
                    <div class="font-bold">${pred.word}</div>
                    ${pred.score !== 0 ? `<div class="text-xs text-gray-500">Score: ${pred.score.toFixed(2)}</div>` : ''}
                `;

                div.onclick = () => selectWord(pred.word);
                container.appendChild(div);
            });
        }

        function selectWord(word) {
            inputText += (inputText ? ' ' : '') + word;
            updateInputDisplay();
            clearCanvas();
        }

        function updateInputDisplay() {
            const display = document.getElementById('inputDisplay');
            if (inputText) {
                display.innerHTML = `<span class="text-white">${inputText}</span><span class="animate-pulse">|</span>`;
            } else {
                display.innerHTML = '<span class="text-gray-500">Start swiping to type...</span>';
            }
        }

        function drawKeyboard() {
            ctx.fillStyle = '#1f2937';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw keys
            ctx.font = '16px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (const [char, pos] of Object.entries(keyLayout)) {
                const x = pos.x * canvas.width;
                const y = pos.y * canvas.height;

                // Key background
                ctx.fillStyle = '#374151';
                ctx.fillRect(x - 20, y - 15, 40, 30);

                // Key border
                ctx.strokeStyle = '#4b5563';
                ctx.strokeRect(x - 20, y - 15, 40, 30);

                // Key label
                ctx.fillStyle = '#9ca3af';
                ctx.fillText(char.toUpperCase(), x, y);
            }
        }

        function drawSwipeTrail() {
            drawKeyboard();

            if (swipePath.length < 2) return;

            ctx.save();

            // Draw trail with gradient
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const gradient = ctx.createLinearGradient(
                swipePath[0].x * canvas.width, swipePath[0].y * canvas.height,
                swipePath[swipePath.length - 1].x * canvas.width,
                swipePath[swipePath.length - 1].y * canvas.height
            );
            gradient.addColorStop(0, 'rgba(0, 212, 255, 0.8)');
            gradient.addColorStop(1, 'rgba(179, 0, 255, 0.8)');

            ctx.strokeStyle = gradient;
            ctx.beginPath();
            swipePath.forEach((point, i) => {
                const x = point.x * canvas.width;
                const y = point.y * canvas.height;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.stroke();

            ctx.restore();
        }

        function clearCanvas() {
            swipePath = [];
            drawKeyboard();
            document.getElementById('predictions').innerHTML = '';
        }

        function updateStatus(text, type) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');

            statusText.textContent = text;

            indicator.classList.remove('bg-gray-500', 'bg-yellow-500', 'bg-green-500', 'bg-red-500', 'animate-pulse');

            switch (type) {
                case 'loading':
                    indicator.classList.add('bg-yellow-500', 'animate-pulse');
                    break;
                case 'ready':
                    indicator.classList.add('bg-green-500');
                    break;
                case 'error':
                    indicator.classList.add('bg-red-500');
                    break;
                case 'warning':
                    indicator.classList.add('bg-yellow-500');
                    break;
                default:
                    indicator.classList.add('bg-gray-500');
            }
        }

        function toggleDebug() {
            debugMode = !debugMode;
            document.getElementById('debugStatus').textContent = debugMode ? 'ON' : 'OFF';
            document.getElementById('debugInfo').classList.toggle('hidden');
        }

        function showDebugInfo(predictions) {
            const content = document.getElementById('debugContent');
            content.innerHTML = `
                <div>Swipe points: ${swipePath.length}</div>
                <div>Predictions: ${predictions.length}</div>
                <div>Top prediction: ${predictions[0]?.word || 'none'} (score: ${predictions[0]?.score?.toFixed(2) || 0})</div>
                <div>Processing time: ${Date.now() - swipePath[0].t}ms</div>
            `;
        }

        // Test function for predefined words
        async function testWord(word) {
            const points = [];
            for (const char of word) {
                if (keyLayout[char]) {
                    const pos = keyLayout[char];
                    // Add multiple points per key
                    for (let i = 0; i < 5; i++) {
                        points.push({
                            x: pos.x + (Math.random() - 0.5) * 0.02,
                            y: pos.y + (Math.random() - 0.5) * 0.02,
                            t: points.length * 10
                        });
                    }
                }
            }

            swipePath = points;
            drawSwipeTrail();
            await processSwipe();
        }
    </script>
</body>
</html>
